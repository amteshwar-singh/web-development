<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>

<body>
    <div class="container">
        <h2>Form Demo</h2>

        <form action="" class="mb-3">
            <div class="row">
                <div class="mb-3 col-md-6">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="text" placeholder="e-mail" class="form-control" id="email">
                </div>
                <div class="mb-3 col-md-6">
                    <label for="pass" class="form-label">password</label>
                    <input type="password" placeholder="password" class="form-control" id="pass">
                </div>
            </div>
            <div class="mb-3">
                <select name="form-select" id="">
                    <option selected>select something</option>
                    <option value="1">mumbai</option>
                    <option value="2">gurdaspur</option>
                    <option value="3">batala</option>
                </select>
            </div>
            <div class="normal mb-3">
                <input type="checkbox" id="a">
                <label for="a">agree</label>
            </div>
            <div class="form-check mb-3">
                <label for="ag" class="form-check-label">agreee</label>
                <input type="checkbox" id="ag" class="form-check-input">
                <!-- same for radio button -->
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="check">
                <label for="check" class="form-check-label">Default</label>
            </div>
        </form>
    </div>
</body>

</html>
