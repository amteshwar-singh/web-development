<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lists</title>
</head>
<body>
    <ul>
        <h4>Unordered list</h4>
        <li>jam</li>
        <li>frooti</li>
        <li>apple</li>
        <li>samosa</li>
        <li>dosa</li>
        <li>jam</li>
    </ul>
    <ol>
        <h4>Ordered list</h4>
        <li>jam</li>
        <li>frooti</li>
        <li>apple</li>
        <li>samosa</li>
        <li>dosa</li>
        <li>jam</li>
    </ol>
    <ol type="A">
        <h4>Ordered list</h4>
        <li>jam</li>
        <li>frooti</li>
        <li>apple</li>
        <li>samosa</li>
        <li>dosa</li>
        <li>jam</li>
    </ol>
</body>
</html>
