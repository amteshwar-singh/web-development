<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <table border="black">
            <caption>&nbsp;&nbsp;&nbsp;Student Information</caption>
            <tr>
                <th rowspan="7">Info</th>
                <th rowspan="2">Name</th>
                <th colspan="2">Address</th>
            </tr>
            <tr>
                <th>City</th>
                <th>House</th>
            </tr>
            <tr>
                <td>A</td>
                <td>Delhi</td>
                <td>1</td>
            </tr>
            <tr>
                <td>B</td>
                <td>Mumbai</td>
                <td>2</td>
            </tr>
            <tr>
                <td>C</td>
                <td>Kolkata</td>
                <td>3</td>
            </tr>
            <tr>
                <td>D</td>
                <td>Pune</td>
                <td>4</td>
            </tr>

        </table>
    </div>
    <hr>
    <div>
        <form action="">
            <label for="Name">Name: </label>

            <input type="text" id="Name" name="vol">
            <br>
            <label for="gender">Sex: </label>
            <input type="radio" id="gender" name="sex" value="M">
            <label for="gender">Male</label>
            <input type="radio" id="gender" name="sex" value="F">
            <label for="gender">Female</label>
            <br>
            Country:
            <select name="country" id="Nations">
                <option >Select an option</option>
                <option value="Ind">India</option>
                <option value="pak">Pakistan</option>
                <option value="us">USA</option>
                <option value="eng">England</option>
                <option value="nep">Nepal</option>
            </select>
            <br>
            <label for="message">Message:</label>
            <br>
            <textarea name="comment" id="message"></textarea>
            <br>
            <input type="checkbox" id="sub" name="subs">
            <label for="sub">Subscribe?</label>
            <br>
            <button>Submit</button>
        </form>
    </div>
    <hr>
    <div>
        <h3>Feedback Form</h3>
        <form>
         <label for="name">Name:</label>
         <input type="text" id="name" name="namee" placeholder="Write your name">
         <br>
         <br>
          <label for="email">Email:</label>
         <input type="text" id="name" name="email" placeholder="Write your email">
         <br>
         <br>
         <label for="Message">Message:</label> 
         <br>
         <textarea name="comment" id="Message"></textarea>
         <br>
         <br>
         <label for="Rating">Rate us out of 5</label> 
            <br>
            <input type="radio" id="Rating" name="rating" value="1">
            <label for="Rating">1</label>
            <br>
            <input type="radio" id="Rating" name="rating" value="2">
            <label for="Rating">2</label>
            <br>
            <input type="radio" id="Rating" name="rating" value="3">
            <label for="Rating">3</label>
            <br>
            <input type="radio" id="Rating" name="rating" value="4">
            <label for="Rating">4</label>
            <br>
            <input type="radio" id="Rating" name="rating" value="5">
            <label for="Rating">5</label>
            <br>
            <br>
            <br>
            <br>
            <button>Send your message!</button>

        </form>

    </div>
</body>
</html>
