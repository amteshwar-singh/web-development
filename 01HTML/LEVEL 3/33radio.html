<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radio</title>
</head>
<body>
    <form>
        <div>

            <input type="radio" id="apple" name="fruit" value="apple">
            <label for="apple">Apple</label>
            <input type="radio" id="banana" name="fruit" value="banana" >
            <label for="banana">banana</label>
            <input type="radio" id="mango" name="fruit" value="mangoo" >
            <label for="mango">mango</label>
            <button>submit</button>
        </div>
        <br>
        <div>
            choose your subject
        <input type="checkbox" id="math" name="subjects" value="math" >
        <label for="maths">math</label>
        <input type="checkbox" id="science" name="subjects" value="science" >
        <label for="science">science</label>
        <input type="checkbox" id="sst" name="subjects" value="sst">
        <label for="sst">sst</label>
        <button>submit</button>
        </div>
    </form>
</body>
</html>
